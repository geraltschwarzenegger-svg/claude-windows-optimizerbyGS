name: Validate PowerShell payloads

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests without applying Windows tweaks
        shell: pwsh
        run: |
          try {
            ./tests/Test-V2.ps1
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error title=Isolated test failure::$message"
            @('### Test failure', '```text', $_.ToString(), $_.ScriptStackTrace, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }
  windows:
    name: Windows / Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests without applying Windows tweaks
        shell: powershell
        run: |
          try {
            ./tests/Test-V2.ps1
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error title=Isolated test failure::$message"
            @('### Test failure', '```text', $_.ToString(), $_.ScriptStackTrace, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }
