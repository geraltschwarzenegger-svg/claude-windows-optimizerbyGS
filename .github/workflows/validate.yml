name: Validate PowerShell payloads

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests without applying Windows tweaks
        shell: pwsh
        run: |
          try {
            ./tests/Test-V2.ps1
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error title=Isolated test failure::$message"
            @('### Test failure', '```text', $_.ToString(), $_.ScriptStackTrace, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }
      - name: Check GPU targets and preset compatibility without registry writes
        shell: pwsh
        run: ./tests/Test-GpuRegistry.ps1
      - name: Check menu layout, navigation and isolated demo
        shell: pwsh
        run: |
          try {
            ./tests/Test-Menu.ps1
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error title=Menu test failure::$message"
            @('### Menu test failure', '```text', $_.ToString(), $_.ScriptStackTrace, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }
      - name: Check Exovance Device Tweaker v2 without applying system settings
        shell: pwsh
        run: ./tests/Test-DeviceTweakerV2.ps1
      - name: Check Exovance selection styling and honest action feedback
        shell: pwsh
        run: ./tests/Test-DeviceTweakerUI.ps1
      - name: Check session reports, registry diffs and diagnostic failures
        shell: pwsh
        run: ./tests/Test-DeviceLogs.ps1
  windows:
    name: Windows / Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests without applying Windows tweaks
        shell: powershell
        run: |
          try {
            ./tests/Test-V2.ps1
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error title=Isolated test failure::$message"
            @('### Test failure', '```text', $_.ToString(), $_.ScriptStackTrace, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }
      - name: Check GPU targets and preset compatibility without registry writes
        shell: powershell
        run: ./tests/Test-GpuRegistry.ps1
      - name: Check menu layout, navigation and isolated demo
        shell: powershell
        run: |
          try {
            ./tests/Test-Menu.ps1
          } catch {
            $message = $_.Exception.Message -replace '[\r\n]+', ' '
            Write-Host "::error title=Menu test failure::$message"
            @('### Menu test failure', '```text', $_.ToString(), $_.ScriptStackTrace, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw
          }
      - name: Check Exovance v2 logic and compile its WinForms UI
        shell: powershell
        run: ./tests/Test-DeviceTweakerV2.ps1
      - name: Check Exovance theme contrast and action states
        shell: powershell
        run: ./tests/Test-DeviceTweakerUI.ps1
      - name: Check session reports, registry diffs and diagnostic failures
        shell: powershell
        run: ./tests/Test-DeviceLogs.ps1
