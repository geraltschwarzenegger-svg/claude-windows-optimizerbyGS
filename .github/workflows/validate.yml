name: Validate PowerShell payloads

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / PowerShell 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests without applying Windows tweaks
        shell: pwsh
        run: ./tests/Test-V2.ps1
  windows:
    name: Windows / Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated tests without applying Windows tweaks
        shell: powershell
        run: ./tests/Test-V2.ps1
