[package]
name = "exovance"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
description = "Exovance terminal frontend and native Windows power plan manager"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dunce = "1"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
