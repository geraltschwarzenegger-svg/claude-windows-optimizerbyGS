<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="662" viewBox="0 0 1280 662" role="img" aria-labelledby="title description">
  <title id="title">Оригинал и v2 — сравнение поведения</title>
  <desc id="description">Информационная схема: в оригинале первый Enter запускает Auto, отдельной проверки и подтверждений нет. В v2 первым открывается Preflight, есть режим /check и подтверждения AUTO и QOL. Размер загрузки сравнивается, если он известен. Оригинальный CMD сохранён.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081425"/>
      <stop offset="0.58" stop-color="#111a36"/>
      <stop offset="1" stop-color="#251b48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#54e7fa"/>
      <stop offset="1" stop-color="#b6a0ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="662" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="660" rx="21" fill="none" stroke="#7386bc" stroke-opacity="0.24"/>
  <rect x="48" y="42" width="34" height="4" rx="2" fill="url(#accent)"/>
  <text x="95" y="49" font-family="Segoe UI,DejaVu Sans,Arial,sans-serif" font-size="14" letter-spacing="2" fill="#99b2d6">BY GS / VERSION COMPARISON</text>
  <text x="1232" y="49" text-anchor="end" font-family="Segoe UI,DejaVu Sans,Arial,sans-serif" font-size="14" fill="#8c9cbb">СХЕМА, НЕ СКРИНШОТ</text>
  <text x="48" y="106" font-family="Segoe UI,DejaVu Sans,Arial,sans-serif" font-size="37" font-weight="700" fill="#f1f6ff">Что меняется при переходе на v2</text>
  <g font-family="Segoe UI,DejaVu Sans,Arial,sans-serif">
    <rect x="48" y="140" width="574" height="438" rx="16" fill="#101a2d" stroke="#41506d"/>
    <rect x="658" y="140" width="574" height="438" rx="16" fill="#101e34" stroke="#5abbd2" stroke-opacity="0.7"/>
    <path d="M64 140h542a16 16 0 0 1 16 16v54H48v-54a16 16 0 0 1 16-16" fill="#202840"/>
    <path d="M674 140h542a16 16 0 0 1 16 16v54H658v-54a16 16 0 0 1 16-16" fill="#193449"/>
    <text x="76" y="185" font-size="25" font-weight="700" letter-spacing="1" fill="#cad4e9">ORIGINAL</text>
    <text x="594" y="183" text-anchor="end" font-size="17" fill="#a0adc8">исходный CMD</text>
    <text x="686" y="185" font-size="25" font-weight="700" letter-spacing="1" fill="#83edf6">V2</text>
    <text x="1204" y="183" text-anchor="end" font-size="17" fill="#b6d9ee">новый отдельный CMD</text>
    <text x="76" y="246" font-size="16" fill="#8e9fbe">ПЕРВЫЙ ENTER В ГЛАВНОМ МЕНЮ</text>
    <text x="76" y="278" font-size="26" font-weight="600" fill="#e4eafa">Запускает Auto</text>
    <text x="686" y="246" font-size="16" fill="#8eafc6">ПЕРВЫЙ ENTER В ГЛАВНОМ МЕНЮ</text>
    <text x="686" y="278" font-size="26" font-weight="600" fill="#8de8f5">Открывает Preflight / About</text>
    <path d="M76 302h518M686 302h518" stroke="#7288b0" stroke-opacity="0.2"/>
    <text x="76" y="333" font-size="16" fill="#8e9fbe">ПОДТВЕРЖДЕНИЕ AUTO / QOL</text>
    <text x="76" y="365" font-size="26" font-weight="600" fill="#e4eafa">Отдельного запроса нет</text>
    <text x="686" y="333" font-size="16" fill="#8eafc6">ПОДТВЕРЖДЕНИЕ AUTO / QOL</text>
    <text x="686" y="365" font-size="26" font-weight="600" fill="#8de8f5">Ручной ввод AUTO или QOL</text>
    <path d="M76 389h518M686 389h518" stroke="#7288b0" stroke-opacity="0.2"/>
    <text x="76" y="420" font-size="16" fill="#8e9fbe">ПРОВЕРКА БЕЗ ПРИМЕНЕНИЯ ТВИКОВ</text>
    <text x="76" y="452" font-size="26" font-weight="600" fill="#e4eafa">Отдельного режима нет</text>
    <text x="686" y="420" font-size="16" fill="#8eafc6">ПРОВЕРКА БЕЗ ПРИМЕНЕНИЯ ТВИКОВ</text>
    <text x="686" y="452" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="27" font-weight="600" fill="#8de8f5">/check</text>
    <text x="804" y="451" font-size="20" fill="#c0d9e9">синтаксис и требования хоста</text>
    <path d="M76 476h518M686 476h518" stroke="#7288b0" stroke-opacity="0.2"/>
    <text x="76" y="507" font-size="16" fill="#8e9fbe">РАЗМЕР ЗАГРУЖЕННОГО ДРАЙВЕРА</text>
    <text x="76" y="539" font-size="24" font-weight="600" fill="#e4eafa">Не сравнивается</text>
    <text x="686" y="507" font-size="16" fill="#8eafc6">РАЗМЕР ЗАГРУЖЕННОГО ДРАЙВЕРА</text>
    <text x="686" y="539" font-size="22" font-weight="600" fill="#8de8f5">Сравнивается, если размер известен</text>
    <circle cx="61" cy="619" r="5" fill="#b6a0ff"/>
    <text x="78" y="626" font-size="20" font-weight="600" fill="#c9baff">Оригинальный файл сохранён без изменений.</text>
    <text x="1232" y="626" text-anchor="end" font-size="17" fill="#8e9fbe">Значения твиков сохранены из оригинала</text>
  </g>
</svg>
